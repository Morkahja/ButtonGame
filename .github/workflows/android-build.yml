name: Android native build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'game.js'
      - 'index.html'
      - 'assets/**'
      - 'sfx/**'
      - 'scripts/sync-www.sh'
  pull_request:
    paths:
      - 'android/**'
      - 'game.js'
      - 'index.html'
      - 'assets/**'
      - 'sfx/**'
      - 'scripts/sync-www.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Kotlin host and Android web assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4

      - name: Synchronize complete web and sound assets
        working-directory: .
        run: |
          bash scripts/sync-www.sh
          git diff --exit-code -- index.html game.js assets android/app/src/main/assets/www
          for sound in 4273.ogg QuickStrikepoints.ogg QuickStrikepoints1.ogg; do
            cmp "sfx/$sound" "assets/sfx/$sound"
            cmp "sfx/$sound" "android/app/src/main/assets/www/assets/sfx/$sound"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default 'tools' SDK package is obsolete.
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate host-owned high-score code is included
        run: |
          grep -q 'scores-v2.json' app/src/main/java/com/babunigaming/buttongame/ScoreStore.kt
          grep -q 'durationMs' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          grep -q 'reactionMs' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          grep -q 'apm' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          test -f app/src/main/assets/www/game.js
          test -f app/src/main/assets/www/index.html

      - name: Test live guest-to-host leaderboard refresh
        working-directory: .
        run: |
          node --check game.js
          node tests/live-leaderboard-refresh.cjs

      - name: Build complete native debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify APK compiled and contains game assets
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/www/game.js'
          unzip -l "$apk" | grep -q 'assets/www/index.html'
          echo "Compiled APK: $(wc -c < "$apk") bytes"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          unzip -l "$unsigned" | grep -q 'assets/www/game.js'
          unzip -l "$unsigned" | grep -q 'assets/www/index.html'
          for sound in 4273.ogg QuickStrikepoints.ogg QuickStrikepoints1.ogg \
                       Bell1.ogg Bell2.ogg Bell3.ogg \
                       impact1.ogg impact2.ogg impact3.ogg impact4.ogg; do
            for built in "$apk" "$unsigned"; do
              entry="assets/www/assets/sfx/$sound"
              unzip -Z -1 "$built" | grep -Fxq "$entry"
              unzip -p "$built" "$entry" | cmp - "app/src/main/assets/www/assets/sfx/$sound"
            done
          done
          echo "Both APKs contain all 10 source-identical OGG recordings."

      - name: Upload unsigned release for local developer signing
        uses: actions/upload-artifact@v4
        with:
          name: ButtonGame-Native-Android-Release-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtonGame-Native-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
