<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="author" content="Babuni.dev" />
  <meta name="developer" content="Babuni.dev" />
  <title>Buttongame by Babuni.dev</title>
  <style>
    @font-face {
      font-family: "AR Essence";
      src: url("assets/AREssence.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --cyan: #00ffff;
      --cyan-dim: #007a7a;
      --white: #ffffff;
      --bg-page: #061214;
      --bg-stage: #030a0c;
      --panel-bg: #050e10;
      --chamfer: 16px;
      --hud-chamfer: 9px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 70% at 50% 45%, #0a1e22 0%, var(--bg-page) 70%);
      color: #c8e8e8;
      font-family: "AR Essence", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #scaler {
      width: min(470px, calc(100vw - 1.5rem));
      height: min(470px, calc(100vw - 1.5rem));
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    #frame {
      position: relative;
      padding: 10px;
      background: transparent;
      flex: 0 0 auto;
      transform-origin: top center;
      clip-path: polygon(
        var(--chamfer) 0%,
        calc(100% - var(--chamfer)) 0%,
        100% var(--chamfer),
        100% calc(100% - var(--chamfer)),
        calc(100% - var(--chamfer)) 100%,
        var(--chamfer) 100%,
        0% calc(100% - var(--chamfer)),
        0% var(--chamfer)
      );
    }

    .frame-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #stage {
      position: relative;
      z-index: 0;
      width: 450px;
      height: 450px;
      aspect-ratio: 1;
      background:
        radial-gradient(circle at 50% 48%, #102a30 0%, #071416 55%, var(--bg-stage) 100%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      clip-path: polygon(
        12px 0%,
        calc(100% - 12px) 0%,
        100% 12px,
        100% calc(100% - 12px),
        calc(100% - 12px) 100%,
        12px 100%,
        0% calc(100% - 12px),
        0% 12px
      );
    }

    #stage::before {
      content: "";
      position: absolute;
      inset: 48px;
      border: 1px solid var(--cyan-dim);
      border-radius: 50%;
      opacity: 0.35;
      pointer-events: none;
    }

    #title {
      position: absolute;
      z-index: 4;
      top: 22px;
      left: 150px;
      right: 150px;
      margin: 0;
      text-align: center;
      font-size: 1.55rem;
      font-weight: normal;
      letter-spacing: 0.14em;
      line-height: 1.15;
      color: var(--cyan);
      opacity: 0.42;
      pointer-events: none;
      font-family: "AR Essence", sans-serif;
    }

    #title .byline {
      display: block;
      margin-top: 0.2em;
      font-size: 0.52em;
      letter-spacing: 0.1em;
      opacity: 0.9;
    }

    .hud-panel,
    .hud-panel-mid,
    .hud-panel-face {
      clip-path: polygon(
        var(--hud-chamfer) 0%,
        calc(100% - var(--hud-chamfer)) 0%,
        100% var(--hud-chamfer),
        100% calc(100% - var(--hud-chamfer)),
        calc(100% - var(--hud-chamfer)) 100%,
        var(--hud-chamfer) 100%,
        0% calc(100% - var(--hud-chamfer)),
        0% var(--hud-chamfer)
      );
    }

    .hud-panel {
      position: absolute;
      z-index: 3;
      width: 6.25rem;
      padding: 1px;
      background: var(--white);
      pointer-events: none;
    }

    /* Place the green bank outside the clipped Points plate. */
    .points-hud-group {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 6;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .points-hud-group .hud-panel.punkte-panel {
      position: relative;
      top: auto;
      left: auto;
      width: max-content;
      min-width: 6.25rem;
      max-width: 12rem;
    }
    .punkte-panel .hud-panel-face { padding-right: 10px; }
    #score-buffer {
      flex: none;
      margin-bottom: 10px;
      color: #61ff94;
      text-shadow: 0 0 9px rgba(65, 255, 120, 0.8);
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    #score-buffer.is-visible { visibility: visible; opacity: 1; }

    /* Reserve a right-side golden readout without shifting during deposits. */
    .time-hud-group {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .time-hud-group .hud-panel.time-panel {
      position: relative;
      top: auto;
      right: auto;
    }
    #time-buffer {
      flex: none;
      min-width: 3.4rem;
      margin-bottom: 10px;
      color: #ffd24a;
      text-align: right;
      text-shadow: 0 0 10px rgba(255, 210, 74, 0.95), 0 0 3px #fff3c0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.1s ease;
    }
    #time-buffer.is-visible { visibility: visible; opacity: 1; }
    /* Single centered lower HUD plate, two metrics with cyan divider. */
    .hud-panel.stats-panel {
      bottom: 10px;
      left: 50%;
      width: 15.5rem;
      transform: translateX(-50%);
      z-index: 6;
    }
    .stats-panel .hud-panel-face { padding: 8px 0 9px; }
    .stats-layout { display: flex; align-items: stretch; }
    .stats-cell {
      flex: 1 1 0;
      min-width: 0;
      padding: 0 11px;
    }
    .stats-cell.apm-cell { text-align: right; }
    .stats-divider {
      flex: none;
      align-self: stretch;
      width: 1px;
      background: var(--cyan);
      opacity: 0.75;
    }
    .stats-panel .hud { font-size: 18px; }

    .hud-panel-mid {
      padding: 1px;
      background: var(--cyan);
    }

    .hud-panel-face {
      padding: 8px 10px 9px;
      background: var(--panel-bg);
    }

    .hud-panel .label {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.75;
      margin-bottom: 2px;
    }

    .hud {
      font-family: "AR Essence", sans-serif;
      font-size: 22px;
      line-height: 1.1;
      white-space: pre;
      min-height: 1.1em;
    }

    #punkte { color: var(--white); }

    #time {
      color: var(--cyan);
      text-align: right;
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    #time.time-bonus {
      color: #ffd24a;
      text-shadow:
        0 0 10px rgba(255, 210, 74, 0.95),
        0 0 3px #fff3c0;
    }

    .hud-panel.time-panel .label { text-align: right; }

    .time-fly {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 7;
      font-family: "AR Essence", sans-serif;
      font-size: 22px;
      color: #ffd24a;
      text-shadow:
        0 0 10px rgba(255, 210, 74, 0.95),
        0 0 3px #fff3c0,
        1px 1px 0 #4a3800;
      white-space: nowrap;
      pointer-events: none;
      will-change: transform, opacity;
    }

    #sound-toggle {
      position: absolute;
      z-index: 5;
      top: 88px;
      right: 22px;
      width: 34px;
      height: 34px;
      padding: 0;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--cyan);
      background: transparent;
      border: 1px solid var(--cyan);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      clip-path: polygon(
        var(--hud-chamfer) 0%,
        calc(100% - var(--hud-chamfer)) 0%,
        100% var(--hud-chamfer),
        100% calc(100% - var(--hud-chamfer)),
        calc(100% - var(--hud-chamfer)) 100%,
        var(--hud-chamfer) 100%,
        0% calc(100% - var(--hud-chamfer)),
        0% var(--hud-chamfer)
      );
    }

    #sound-toggle:hover,
    #sound-toggle:focus-visible {
      color: var(--white);
      border-color: var(--white);
      outline: none;
    }

    #sound-toggle svg {
      width: 18px;
      height: 18px;
      display: block;
      pointer-events: none;
    }

    #sound-toggle .icon-muted { display: none; }
    #sound-toggle.is-muted .icon-on { display: none; }
    #sound-toggle.is-muted .icon-muted { display: block; }

    #trap-option {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 144px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      background: rgba(5,14,16,.88);
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 7px;
      color: var(--white);
      font: 15px system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }
    #trap-option[hidden] { display: none !important; }
    #trap-option img { width: 23px; height: 23px; }
    #traps-toggle { width: 19px; height: 19px; accent-color: #e33b45; cursor: pointer; }
    .trap-score-icon {
      display: inline-block; width: 15px; height: 15px; margin-left: 5px;
      vertical-align: -2px;
    }

    #anleitung {
      position: absolute;
      z-index: 2;
      top: 96px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--white);
      font-family: "AR Essence", sans-serif;
      font-size: 22px;
      line-height: 1.1;
      pointer-events: none;
    }

    #end-wrap {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      top: 88px;
      bottom: 96px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      padding: 0 1rem;
    }

    #end-wrap.visible {
      display: flex;
      pointer-events: auto;
    }

    #end {
      margin: 0;
      flex: 0 0 auto;
      text-align: center;
      color: var(--white);
      font-family: "AR Essence", sans-serif;
      font-size: 28px;
      min-height: 1.2em;
    }

    #score-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: min(240px, 90%);
    }

    #score-form[hidden] { display: none !important; }

    #player-name {
      width: 100%;
      padding: 0.45rem 0.6rem;
      font-family: "AR Essence", sans-serif;
      font-size: 1rem;
      color: var(--white);
      background: #050e10;
      border: 1px solid var(--cyan);
      text-align: center;
    }

    #player-name::placeholder { color: #5a7a7e; }

    #score-status {
      min-height: 1.1em;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      color: var(--cyan);
      opacity: 0.85;
    }

    .btn-cyan {
      margin: 0;
      padding: 0.45rem 1.2rem;
      font-family: "AR Essence", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--bg-page);
      background: var(--cyan);
      border: 1px solid var(--white);
      pointer-events: auto;
      clip-path: polygon(
        10px 0%,
        calc(100% - 10px) 0%,
        100% 10px,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        10px 100%,
        0% calc(100% - 10px),
        0% 10px
      );
      cursor: pointer;
    }

    .btn-cyan:hover { filter: brightness(1.08); }
    .btn-cyan:disabled { opacity: 0.5; cursor: default; filter: none; }

    /* Between Reaction (left) and APM (right) at the bottom of the frame. */
    #play-again {
      display: none;
      position: absolute;
      /* Overlay the bottom Reaction/APM plate at Game Over. */
      z-index: 12;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 15.5rem;
      min-height: 54px;
      text-align: center;
      font-size: 1.2rem;
    }

    #play-again:not([hidden]) { display: inline-block; }

    #leaderboard {
      display: none;
      flex: 1 1 auto;
      width: min(280px, 82%);
      min-height: 0;
      max-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      /* Preserve scrolling but hide visible scrollbar on desktop/mobile. */
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 0.5rem 0.65rem;
      background: rgba(5, 14, 16, 0.88);
      border: 1px solid var(--cyan-dim);
      pointer-events: auto;
      touch-action: pan-y;
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      color: #b8e0e0;
    }

    #leaderboard::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #end-wrap.visible #leaderboard {
      display: block;
    }

    #leaderboard h2 {
      position: sticky;
      top: 0;
      margin: 0 0 0.4rem;
      padding-bottom: 0.25rem;
      background: rgba(5, 14, 16, 0.95);
      font-family: "AR Essence", sans-serif;
      font-size: 0.95rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--cyan);
      text-align: center;
    }

    #leaderboard ol {
      margin: 0;
      padding-left: 1.3rem;
    }

    #leaderboard li {
      margin: 0.45rem 0;
    }
    .score-entry-heading { color: var(--white); font-size: 0.82rem; }
    .score-entry-details { color: #a5d5d8; font-size: 0.66rem; line-height: 1.4; }

    #leaderboard .empty {
      text-align: center;
      opacity: 0.7;
    }

    /* Subtle host-high-score glimpse below the playfield while playing.
       Always reserve its height so loading doesn't move the playfield. */
    #live-leaderboard {
      width: min(420px, calc(100vw - 2rem));
      height: 114px;
      flex: 0 0 auto;
      align-self: center;
      padding: 0 0.65rem;
      color: #a5d8d9;
      font-family: system-ui, sans-serif;
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 24%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 24%, transparent 100%);
    }
    #live-leaderboard.is-hidden { visibility: hidden; }
    #live-leaderboard h2 {
      color: var(--cyan);
      font-family: "AR Essence", sans-serif;
      font-weight: normal;
      font-size: 0.93rem;
      letter-spacing: 0.12em;
      margin: 0 0 0.35rem;
      text-align: center;
    }
    #live-leaderboard ol {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.18rem;
    }
    #live-leaderboard li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.8rem;
      font-size: 0.79rem;
      line-height: 1.35;
    }
    #live-leaderboard .preview-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #live-leaderboard .preview-points {
      color: #d3ffff;
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    #react { color: var(--white); }
    #apm { color: var(--cyan); }

    /* Tiny, non-interactive source marker where ordinary point numbers emerge. */
    #point-source {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      background: #d5ffff;
      box-shadow: 0 0 5px 2px rgba(0, 255, 255, 0.65),
                  0 0 13px 4px rgba(0, 255, 255, 0.23);
      transform: translate(-50%, -50%) scale(1);
      animation: point-source-breathe 2s ease-in-out infinite;
    }

    /* Quick Strike feedback remains green throughout the qualifying button. */
    #point-source.is-quick-strike {
      background: #b5ffd2;
      box-shadow: 0 0 5px 2px rgba(74, 255, 117, 0.84),
                  0 0 15px 4px rgba(47, 255, 102, 0.36);
    }
    #point-source.is-quick-strike::before {
      background: radial-gradient(circle, rgba(46,255,111,0.33) 0%,
                                           rgba(42,255,104,0.12) 48%,
                                           transparent 70%);
    }

    #point-source::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,255,0.24) 0%,
                                           rgba(0,255,255,0.06) 48%,
                                           transparent 70%);
    }

    @keyframes point-source-breathe {
      0%, 100% {
        opacity: 0.73;
        transform: translate(-50%, -50%) scale(0.88);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.23);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #point-source { animation: none; opacity: 0.9; }
    }

    #float-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .floater {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "AR Essence", sans-serif;
      font-size: 22px;
      color: var(--cyan);
      text-shadow:
        0 0 6px rgba(0, 255, 255, 0.55),
        1px 1px 0 #003333;
      white-space: nowrap;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    /* An eligible bonus total glows gold while it lives or until it merges. */
    .floater.bonus-eligible:not(.score-ready) {
      color: #ffd24a;
      text-shadow: 0 0 10px rgba(255, 210, 74, 0.95),
                   0 0 3px #fff3c0, 1px 1px 0 #4a3800;
    }

    .floater.big {
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(0, 255, 255, 0.8),
        0 0 2px #00ffff;
    }

    .floater.linger {
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(0, 255, 255, 0.95),
        0 0 4px #00ffff,
        1px 1px 0 #003333;
    }

    .floater.jackpot-flash {
      color: #ffffff;
      font-size: 2rem !important;
      text-shadow:
        0 0 16px rgba(0, 255, 255, 1),
        0 0 6px #ffffff;
      z-index: 6;
    }

    /* Center-stage reversal at the same upper-center position as "Smash it!". */
    .floater.reverse-37 {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 7;
      font-size: 30px;
      font-weight: normal;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(0,255,255,0.8), 0 0 4px #ffffff;
      backface-visibility: visible;
      pointer-events: none;
      transform-origin: center;
      will-change: transform, color;
    }
    .floater.reverse-37:not(.reverse-green) {
      color: #ffd24a;
      text-shadow: 0 0 14px rgba(255, 210, 74, 0.95),
                   0 0 4px #fff3c0;
    }
    .floater.reverse-37.reverse-green {
      color: #61ff94;
      text-shadow: 0 0 12px rgba(65,255,120,0.95), 0 0 3px #d9ffe5;
    }

    /* Standalone, non-scoring visual pieces used only by the 21 -> 42 combo.
       They live above the stage float layer and never enter physics merging. */
    .combo-unit {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 7;
      pointer-events: none;
      font-family: "AR Essence", sans-serif;
      font-size: 26px;
      line-height: 1;
      white-space: nowrap;
      color: #dbffff;
      text-shadow: 0 0 9px rgba(0,255,255,0.85), 0 0 3px #fff;
      transform-origin: center;
      will-change: transform, opacity;
    }
    .combo-unit.converted {
      color: #ffd24a;
      text-shadow: 0 0 10px rgba(255,210,74,0.9), 0 0 3px #fff3c0;
    }

    .floater.score-ready,
    .floater.big.score-ready,
    .floater.linger.score-ready,
    .floater.jackpot-flash.score-ready {
      color: #61ff94;
      text-shadow: 0 0 9px rgba(60,255,128,0.8), 0 0 3px #d9ffe5;
    }

    /* Paint incoming score pickups above sibling HUDs, not inside #stage. */
    #score-fly-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      overflow: visible;
    }
    .score-fly {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      pointer-events: none;
      font-family: "AR Essence", sans-serif;
      font-size: 22px;
      line-height: 1.1;
      color: #61ff94;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(65,255,120,0.85), 0 0 2px #d9ffe5;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .score-fly.is-feeding {
      text-shadow: 0 0 10px rgba(65,255,120,0.95), 0 0 3px #d9ffe5;
    }

    #feind {
      position: absolute;
      left: 0;
      top: 0;
      width: 72px;
      height: 72px;
      margin-left: -36px;
      margin-top: -36px;
      cursor: pointer;
      transform-origin: center center;
      z-index: 1;
      will-change: transform, filter;
    }

    #feind img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    #feind.show-idle .feind0,
    #feind.show-hit .feind1 {
      display: block;
    }

    #feind .feind0 { width: 62px; height: 62px; }
    #feind .feind1 { width: 62px; height: 62px; }

    #feind.is-gone { visibility: hidden; pointer-events: none; }
    #feind.is-shattering > img.feind0,
    #feind.is-shattering > img.feind1 { visibility: hidden; }
    #feind .button-piece {
      position: absolute;
      left: 5px;
      top: 5px;
      width: 62px;
      height: 62px;
      display: block;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    #feind .button-cracks {
      position: absolute;
      left: 5px;
      top: 5px;
      width: 62px;
      height: 62px;
      overflow: hidden;
      pointer-events: none;
      clip-path: circle(45.7% at center);
      z-index: 2;
    }

    #live-wrap {
      width: min(470px, calc(100vw - 1.5rem));
      flex: 0 0 auto;
    }

    #live-wrap .live-heading {
      margin: 0 0 0.35rem;
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.8;
    }

    #live-players {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    #live-players:empty::after {
      content: "Waiting for players…";
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      color: #5a7a7e;
    }

    .live-chip {
      flex: 0 0 auto;
      min-width: 7.5rem;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--cyan-dim);
      background: rgba(5, 14, 16, 0.92);
      color: var(--white);
      font-family: system-ui, sans-serif;
      line-height: 1.25;
    }

    .live-chip .live-name {
      color: var(--cyan);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 9rem;
    }

    .live-chip .live-score {
      font-family: "AR Essence", sans-serif;
      font-size: 1.15rem;
      color: var(--white);
    }

    .live-chip .live-meta {
      font-size: 0.68rem;
      color: #8aa8ac;
      white-space: nowrap;
    }

    .live-chip.is-self {
      border-color: var(--cyan);
    }
  </style>
</head>
<body>
  <div id="live-wrap" aria-live="polite">
    <div class="live-heading">Live players</div>
    <div id="live-players"></div>
  </div>
  <div id="scaler">
  <div id="frame">
    <svg class="frame-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon
        points="3.5,0.5 96.5,0.5 99.5,3.5 99.5,96.5 96.5,99.5 3.5,99.5 0.5,96.5 0.5,3.5"
        fill="none" stroke="#ffffff" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.9" />
      <polygon
        points="4.3,1.4 95.7,1.4 98.6,4.3 98.6,95.7 95.7,98.6 4.3,98.6 1.4,95.7 1.4,4.3"
        fill="none" stroke="#00ffff" stroke-width="1" vector-effect="non-scaling-stroke" />
    </svg>

    <div class="points-hud-group">
      <div class="hud-panel punkte-panel">
        <div class="hud-panel-mid">
          <div class="hud-panel-face">
            <span class="label">Points</span>
            <div id="punkte" class="hud">0</div>
          </div>
        </div>
      </div>
      <div id="score-buffer" class="hud" aria-label="Pending score">+0</div>
    </div>

    <div class="time-hud-group">
      <div id="time-buffer" class="hud" aria-label="Pending bonus time">+0s</div>
      <div class="hud-panel time-panel">
        <div class="hud-panel-mid">
          <div class="hud-panel-face">
            <span class="label">Time</span>
            <div id="time" class="hud">60</div>
          </div>
        </div>
      </div>
    </div>

    <button type="button" id="sound-toggle" aria-pressed="false" aria-label="Mute sound" title="Sound">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.3-3.9v7.8A4.5 4.5 0 0 0 16.5 12zm0-8.2v2.1a6.6 6.6 0 0 1 0 12.2v2.1c4.1-1.1 7-4.9 7-9.2s-2.9-8.1-7-9.2z"/>
      </svg>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M16.5 12a4.5 4.5 0 0 0-2.3-3.9l-1.5 1.5A2.6 2.6 0 0 1 14.2 12v.2l2.2 2.2c.1-.5.1-.9.1-1.4zM19.1 4.3l-1.4 1.4A8.7 8.7 0 0 1 21.2 12c0 2.1-.7 4-1.9 5.6l1.5 1.5C22.5 17 23.5 14.6 23.5 12c0-3.4-1.7-6.4-4.4-7.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 4v-5.7l5.7 5.7 1.3-1.3L4.3 3zM12 5.2 9.9 7.3 12 9.4V5.2z"/>
      </svg>
    </button>

    <div class="hud-panel stats-panel" aria-label="Reaction time and actions per minute">
      <div class="hud-panel-mid">
        <div class="hud-panel-face stats-layout">
          <div class="stats-cell react-cell">
            <span class="label">Reaction</span>
            <div id="react" class="hud">—</div>
          </div>
          <div class="stats-divider" aria-hidden="true"></div>
          <div class="stats-cell apm-cell">
            <span class="label">APM</span>
            <div id="apm" class="hud">—</div>
          </div>
        </div>
      </div>
    </div>

    <h1 id="title">Buttongame<span class="byline">by Babuni.dev</span></h1>

    <button type="button" id="play-again" class="btn-cyan" hidden>Play again</button>

    <div id="stage" aria-label="Buttongame">
      <div id="anleitung">Smash it!</div>
      <label id="trap-option" for="traps-toggle">
        <img src="assets/button-red.svg" alt="" aria-hidden="true" />
        <span>Traps</span>
        <input id="traps-toggle" type="checkbox" aria-label="Enable red trap buttons" />
      </label>
      <div id="point-source" aria-hidden="true"></div>
      <div id="float-layer" aria-hidden="true"></div>
      <div id="end-wrap">
        <div id="end"></div>
        <div id="leaderboard" aria-live="polite">
          <h2>High scores</h2>
          <div id="leaderboard-body" class="empty">No scores yet</div>
        </div>
        <form id="score-form" hidden>
          <input id="player-name" type="text" maxlength="16" autocomplete="nickname" placeholder="Your name" />
          <button type="submit" id="submit-score" class="btn-cyan">Submit score</button>
          <div id="score-status"></div>
        </form>
      </div>
      <div id="feind" class="show-idle" role="button" tabindex="0" aria-label="Ziel">
        <img class="feind0" src="assets/button.svg" width="62" height="62" alt="" draggable="false" />
        <img class="feind1" src="assets/button.svg" width="62" height="62" alt="" draggable="false" />
      </div>
    </div>
    <div id="score-fly-layer" aria-hidden="true"></div>
  </div>
  </div>
  <section id="live-leaderboard" class="is-hidden" aria-label="Current high scores" aria-hidden="true">
    <h2>High scores</h2>
    <ol id="live-leaderboard-list"></ol>
  </section>
  <script src="game.js"></script>
</body>
</html>
