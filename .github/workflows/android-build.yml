name: Android native build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'game.js'
      - 'index.html'
      - 'assets/**'
      - 'sfx/**'
      - 'scripts/sync-www.sh'
      - 'scripts/serve-desktop.py'
      - 'tests/**'
  pull_request:
    paths:
      - 'android/**'
      - 'game.js'
      - 'index.html'
      - 'assets/**'
      - 'sfx/**'
      - 'scripts/sync-www.sh'
      - 'scripts/serve-desktop.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Kotlin host and Android web assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4

      - name: Synchronize complete web and sound assets
        working-directory: .
        run: |
          bash scripts/sync-www.sh
          git diff --exit-code -- index.html game.js assets android/app/src/main/assets/www
          for sound in 4273.ogg QuickStrikepoints.ogg QuickStrikepoints1.ogg; do
            cmp "sfx/$sound" "assets/sfx/$sound"
            cmp "sfx/$sound" "android/app/src/main/assets/www/assets/sfx/$sound"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default 'tools' SDK package is obsolete.
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate host-owned high-score code is included
        run: |
          grep -q 'scores-v2.json' app/src/main/java/com/babunigaming/buttongame/ScoreStore.kt
          grep -q 'durationMs' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          grep -q 'reactionMs' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          grep -q 'apm' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
           grep -q 'trapsEnabled' app/src/main/java/com/babunigaming/buttongame/ScoreStore.kt
           grep -q 'trapsEnabled' app/src/main/java/com/babunigaming/buttongame/GameServer.kt
          test -f app/src/main/assets/www/game.js
          test -f app/src/main/assets/www/index.html

      - name: Test desktop LAN host scoring and presence
        working-directory: .
        run: python3 -m unittest discover -s tests -p test_desktop_host.py

      - name: Test live guest-to-host leaderboard refresh
        working-directory: .
        run: |
          node --check game.js
          node tests/live-leaderboard-refresh.cjs
           node tests/trap-mode.cjs

      - name: Build complete native debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify APK compiled and contains game assets
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/www/game.js'
          unzip -l "$apk" | grep -q 'assets/www/index.html'
          echo "Compiled APK: $(wc -c < "$apk") bytes"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          unzip -l "$unsigned" | grep -q 'assets/www/game.js'
          unzip -l "$unsigned" | grep -q 'assets/www/index.html'
          for sound in 4273.ogg QuickStrikepoints.ogg QuickStrikepoints1.ogg \
                       Bell1.ogg Bell2.ogg Bell3.ogg \
                       impact1.ogg impact2.ogg impact3.ogg impact4.ogg; do
            for built in "$apk" "$unsigned"; do
              entry="assets/www/assets/sfx/$sound"
              unzip -Z -1 "$built" | grep -Fxq "$entry"
              unzip -p "$built" "$entry" | cmp - "app/src/main/assets/www/assets/sfx/$sound"
            done
          done
          echo "Both APKs contain all 10 source-identical OGG recordings."

      # Do not call an ephemeral GitHub debug build an update APK. Once the
      # creator configures the ORIGINAL signing key as encrypted Actions
      # secrets, a signed APK can be produced with the same certificate.
      - name: Sign update with original release certificate (optional)
        if: github.event_name != 'pull_request'
        env:
          BUTTON_GAME_KEYSTORE_B64: ${{ secrets.BUTTON_GAME_KEYSTORE_B64 }}
          BUTTON_GAME_KEYSTORE_PASSWORD: ${{ secrets.BUTTON_GAME_KEYSTORE_PASSWORD }}
          BUTTON_GAME_KEY_ALIAS: ${{ secrets.BUTTON_GAME_KEY_ALIAS }}
          BUTTON_GAME_KEY_PASSWORD: ${{ secrets.BUTTON_GAME_KEY_PASSWORD }}
        run: |
          if [ -z "$BUTTON_GAME_KEYSTORE_B64" ] || [ -z "$BUTTON_GAME_KEYSTORE_PASSWORD" ]; then
            echo "Original signing secrets not configured: unsigned release only."
            exit 0
          fi
          umask 077
          keyfile="$RUNNER_TEMP/Buttongame-signing-keystore.p12"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$BUTTON_GAME_KEYSTORE_B64" | base64 --decode > "$keyfile"
          buildtools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          aligned="$RUNNER_TEMP/aligned.apk"
          output=app/build/outputs/apk/release/ButtonGame-Signed-Update.apk
          "$buildtools/zipalign" -f -p 4 "$unsigned" "$aligned"
          if [ -n "$BUTTON_GAME_KEY_ALIAS" ]; then
            "$buildtools/apksigner" sign --ks "$keyfile" --ks-type PKCS12 \
              --ks-key-alias "$BUTTON_GAME_KEY_ALIAS" \
              --ks-pass env:BUTTON_GAME_KEYSTORE_PASSWORD \
              --out "$output" "$aligned"
          else
            "$buildtools/apksigner" sign --ks "$keyfile" --ks-type PKCS12 \
              --ks-pass env:BUTTON_GAME_KEYSTORE_PASSWORD \
              --out "$output" "$aligned"
          fi
          certificate=$("$buildtools/apksigner" verify --print-certs "$output" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -n 1 | tr '[:upper:]' '[:lower:]')
          # Public fingerprint of original PKCS#12 certificate, as documented
          # in the historical DEVLOG. Never use a new CI debug certificate.
          expected=3f7a1386adb23903ebd09c54a4f7105d197b7a6611be4b5dd53c7fe5e0902392
          if [ "$certificate" != "$expected" ]; then
            rm -f "$output"
            echo "::error::Signer differs from the original release certificate; refusing incompatible update."
            exit 1
          fi
          echo "Signed APK matches the original Button Game certificate."

      - name: Upload original-certificate signed update (when configured)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ButtonGame-Update-Original-Signing-Key
          path: android/app/build/outputs/apk/release/ButtonGame-Signed-Update.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload unsigned release for local developer signing
        uses: actions/upload-artifact@v4
        with:
          name: ButtonGame-Native-Android-Release-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtonGame-Native-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
